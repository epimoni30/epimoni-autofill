name: Wrong or missed field
description: The extension put the wrong value in a field, filled one it should have left alone, or missed one.
title: "[fill] "
labels: ["fill"]
body:
  - type: markdown
    attributes:
      value: |
        A wrong fill is the most serious kind of bug here, so thank you.
        **Do not paste your real CV data.** Describe the field, not what you typed into it.
  - type: dropdown
    id: kind
    attributes:
      label: What happened
      options:
        - It filled a field with the wrong value
        - It filled a field it should have left empty
        - It missed a field it should have filled
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The application page. Remove any personal token from the URL.
      placeholder: https://…
    validations:
      required: true
  - type: textarea
    id: field
    attributes:
      label: The field
      description: Its label as shown on the page, and the value you expected.
      placeholder: |
        Label: "Nom de l'entreprise actuelle"
        Filled with: my surname
        Expected: left empty, or my current employer
    validations:
      required: true
  - type: textarea
    id: markup
    attributes:
      label: The field's HTML (optional, very helpful)
      description: Right-click the field → Inspect → copy the `<label>` and `<input>`. Remove any value you typed.
      render: html
  - type: input
    id: version
    attributes:
      label: Extension version
      description: From chrome://extensions.
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      description: From chrome://version.
