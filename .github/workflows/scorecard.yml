name: scorecard

# OpenSSF Scorecard: an outside check of this repository's supply-chain habits (pinned actions,
# token permissions, branch protection, code review, signed releases and so on). The results
# land in the Security tab and on the public badge in the README, so a regression shows up
# where anyone can see it, us first.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 2'
  # Branch protection changes are not pushes; this catches them within a week, or on demand.
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      # Upload results to the Security tab.
      security-events: write
      # Publish results and get a badge (OIDC token, no secret involved).
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
