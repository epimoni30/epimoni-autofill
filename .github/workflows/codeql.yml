name: codeql

# Static security analysis of the extension's JavaScript. An extension that reads every
# application page it runs on, and holds a session token, is worth a second pair of eyes.
#
# Free on a public repository. On a private one it needs GitHub Advanced Security, so the job
# is skipped while the repository is private and starts running on its own once it is public.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # Job-level permissions *replace* the workflow's, they do not add to them: without
    # `contents: read` here the token cannot read its own repository, which on a private repo
    # fails the checkout as "Repository not found". `actions: read` is what CodeQL needs to
    # read the workflow run on a private repository.
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: javascript-typescript
          # Test fixtures are captured third-party pages, not our code.
          config: |
            paths-ignore:
              - test/fixtures
              - dist

      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
