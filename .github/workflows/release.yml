name: release

# Push a tag `v<version>` and this builds the zip the Chrome Web Store takes, then attaches
# it to a GitHub release. Uploading to the store itself stays a manual step.

on:
  push:
    tags: ['v*']

# Read-only by default. The build job runs `npm ci` and a browser test suite, which is
# third-party code, so it must never hold a token that can push to this repository or rewrite a release.
# Only the last job, which runs nothing but `gh release create` on the artifact, can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      # The store shows manifest.json's version, so a tag that disagrees with it would ship
      # a zip whose number nobody asked for.
      - name: Tag matches manifest.json and package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag manifest=$manifest package=$pkg"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match manifest.json ($manifest) and package.json ($pkg)"
            exit 1
          fi

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The full gate, same as every pull request: nothing ships that `check` would refuse.
      - run: npm run check

      # `check` ends with e2e, which leaves a *dev* build in dist/ (localhost permissions and
      # a URL-triggered auto-run). Rebuild, then prove the dev build did not survive.
      - run: npm run build
      - name: dist/ is a production build
        run: |
          if grep -qE '127\.0\.0\.1|localhost' dist/manifest.json; then
            echo "::error::dist/manifest.json still grants localhost: this is a dev build"
            exit 1
          fi
          grep -q 'const EPIMONI_DEV = false' dist/content.js
          grep -q 'globalThis.EPIMONI_DEV = false' dist/background.js

      # Everything the release job attaches goes into one directory, written by absolute path,
      # and is checked here. v0.1.0's first run uploaded three separate paths and the Firefox
      # zip never reached the artifact although its step passed; the release job only found
      # out when `gh` could not attach it. Now a missing or empty file fails this job, the
      # listing is in the log, and the upload takes a single directory.
      - name: Package the zips and the release notes
        run: |
          out="$GITHUB_WORKSPACE/release"
          name="epimoni-autofill-${GITHUB_REF_NAME}"
          rm -rf "$out" && mkdir -p "$out"

          (cd dist && zip -qr "$out/$name.zip" .)

          # The same source for addons.mozilla.org: only the manifest differs (platform/firefox.mjs).
          node build.mjs --target=firefox
          (cd dist-firefox && zip -qr "$out/$name-firefox.zip" .)

          # Release notes: the CHANGELOG section for this version, if one exists.
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$out/notes.md"
          [ -s "$out/notes.md" ] || echo "See CHANGELOG.md." > "$out/notes.md"

          ls -la "$out"
          for f in "$name.zip" "$name-firefox.zip" notes.md; do
            if [ ! -s "$out/$f" ]; then
              echo "::error::release/$f is missing or empty"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          name="epimoni-autofill-${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" "release/$name.zip" "release/$name-firefox.zip" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release/notes.md --verify-tag
