<!doctype html>
<!-- `lang` is set at runtime from chrome.i18n.getUILanguage(): this file used to be hardcoded
     `fr`, which told a screen reader to read English and Spanish text with a French voice. -->
<html>
<meta charset="utf-8">
<title>Epimoni</title>
<style>
  :root { color-scheme: light dark; --fg: #111; --muted: #71717a; --line: #e4e4e7; --bg: #fff; --accent: #7c5cff; --ok: #15803d; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --bg: #18181b; --ok: #4ade80; } }
  body { width: 300px; margin: 0; padding: 14px; font: 13px/1.5 system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .warn { color: #b45309; }
  .ok { color: var(--ok); }
  button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  a { color: var(--accent); }
  select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .group { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .action { width: 100%; text-align: left; padding: 8px 11px; }
  .action:disabled { opacity: .45; cursor: not-allowed; }
  .note { font-size: 12px; color: var(--muted); }
  .note a { display: inline-block; margin-top: 2px; font-weight: 600; }
  .note .linkish { border: 0; padding: 0; margin-top: 2px; color: var(--accent); font-weight: 600; }
  #cv select { width: 100%; margin-top: 4px; }
  .site { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; cursor: pointer; }
  .site input { margin: 2px 0 0; accent-color: var(--accent); }
  .site b { font-weight: 600; overflow-wrap: anywhere; }
</style>
<body>
  <!-- Every string carries `data-i18n`, applied by popup.js. `chrome.i18n` cannot substitute
       into HTML the way it does in the manifest, so the markup names the key and the script
       resolves it. -->
  <h1 data-i18n="popup_title"></h1>
  <div id="cv" class="muted"></div>
  <div class="group">
    <button type="button" id="fill" class="action primary" data-i18n="popup_fill"></button>
    <label class="site" id="site-row" hidden>
      <input type="checkbox" id="site-auto">
      <span id="site-text"></span>
    </label>
    <div id="site-note" class="note"></div>
  </div>
  <div class="group">
    <div class="label" data-i18n="popup_ai_heading"></div>
    <button type="button" id="analyse" class="action" data-i18n="popup_analyse" disabled></button>
    <button type="button" id="letter" class="action" data-i18n="popup_letter" disabled></button>
    <button type="button" id="tailor" class="action" data-i18n="popup_tailor" disabled></button>
    <div id="ai-note" class="note"></div>
  </div>
  <div class="group">
    <button type="button" id="dashboard" class="action" data-i18n="popup_dashboard"></button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
