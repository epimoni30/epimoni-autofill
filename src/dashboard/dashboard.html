<!doctype html>
<!-- The extension's own page: the CV it fills from (the only surface that can create one) and
     the applications it filled, behind one menu. `lang` is set at runtime from
     chrome.i18n.getUILanguage(); the view is the hash: #cv (default) or #candidatures. -->
<html>
<meta charset="utf-8">
<title>Epimoni</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #18181b; --muted: #71717a; --line: #e4e4e7; --bg: #fafafa; --card: #fff;
    --accent: #7c5cff; --warn: #b45309; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --bg: #121214; --card: #18181b; --warn: #fbbf24; --ok: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 16px 80px; font: 14px/1.55 system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--bg); }
  a { color: var(--accent); }
  .shell { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: start; }
  main { max-width: 800px; min-width: 0; }
  .menu { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 2px; }
  .menu .brand { font-weight: 700; font-size: 15px; margin: 2px 10px 12px; }
  .menu a { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; }
  .menu a:hover { background: var(--card); }
  .menu a[aria-current="page"] { background: var(--card); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
  .menu .count { color: var(--muted); font-weight: 400; font-size: 12px; align-self: center; }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; gap: 14px; }
    .menu { position: static; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .menu .brand { width: 100%; margin: 0 4px 6px; }
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); }
  .ok { color: var(--ok); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 14px; }
  .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
  .row.one { grid-template-columns: 1fr; }
  .row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 560px) { .row, .row.three { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  input, textarea, select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; }
  button.danger { color: #b91c1c; }
  .entry { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .entry-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .entry-head b { font-size: 12px; color: var(--muted); font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px; }
  .bar-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .badge { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--muted); }
  .grow { flex: 1; min-width: 0; }
  .cv-list { list-style: none; margin: 0; padding: 0; }
  .cv-row { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; }
  .cv-row.active { border-color: var(--accent); }
  .cv-row b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cv-row .meta { font-size: 12px; color: var(--muted); }
  .cv-row input { max-width: 260px; }
  /* Narrow: the name takes the whole row and the buttons wrap underneath, rather than the
     text being squeezed into a four-line column beside them. */
  @media (max-width: 560px) {
    .cv-row { flex-wrap: wrap; }
    .cv-row .grow { flex: 1 0 100%; }
  }
  /* The applications view: a board, one column per status. It takes the page's width. */
  .shell:has([data-view="candidatures"]:not([hidden])) { max-width: 1480px; }
  main:has([data-view="candidatures"]:not([hidden])) { max-width: none; }
  .trk-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 12px; }
  .board { display: grid; grid-template-columns: repeat(5, minmax(172px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; align-items: start; }
  .col { background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 0; min-height: 160px; transition: background .12s, border-color .12s; }
  .col.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .col-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin: 0 2px 8px; }
  .col-head .count { color: var(--muted); font-weight: 400; font-size: 12px; }
  .apps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .app { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; cursor: grab; display: flex; flex-direction: column; gap: 3px; }
  .app.dragging { opacity: .45; }
  .app-title { font-weight: 600; overflow-wrap: anywhere; }
  .app-meta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .app-meta.where { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app select { width: 100%; margin-top: 4px; padding: 4px 6px; font-size: 12px; }
  .app textarea { min-height: 54px; font-size: 13px; margin-top: 4px; }
  .app-foot { display: flex; flex-wrap: wrap; gap: 4px; justify-content: space-between; }
  .app-foot button.link { font-size: 12px; padding: 2px 0; }
  .add-form { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 12px; }
  .add-form .row { grid-template-columns: 2fr 1.4fr 2fr 1fr; align-items: end; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; text-align: center; }
  @media (max-width: 760px) {
    .board { grid-template-columns: 1fr; overflow-x: visible; }
    .col { min-height: 0; }
    .add-form .row { grid-template-columns: 1fr; }
  }
</style>
<body>
<div class="shell">
<nav class="menu" aria-label="Epimoni">
  <div class="brand">Epimoni</div>
  <a href="#cv" data-nav="cv"><span data-i18n="dash_menu_cv"></span></a>
  <a href="#candidatures" data-nav="candidatures"><span data-i18n="dash_menu_applications"></span><span id="nav-count" class="count"></span></a>
  <a href="#sites" data-nav="sites"><span data-i18n="dash_menu_sites"></span></a>
</nav>
<main>
<div data-view="cv">
  <h1 data-i18n="opt_title"></h1>
  <p class="muted" data-i18n="opt_intro" style="margin-top:0"></p>

  <section id="status-card">
    <h2 data-i18n="opt_status_heading"></h2>
    <div id="status"></div>
    <div class="actions" style="margin-top:10px">
      <a id="site-link" class="badge" href="https://www.epimoni30.com/extension-chrome" target="_blank" rel="noopener" data-i18n="opt_from_account"></a>
      <button type="button" id="import" data-i18n="opt_import"></button>
      <button type="button" id="export" data-i18n="opt_export"></button>
      <input id="file" type="file" accept="application/json,.json" hidden>
    </div>
    <div id="import-msg" class="muted" style="margin-top:6px"></div>
    <div class="muted" style="margin-top:6px; font-size:12px" data-i18n="opt_export_hint"></div>
  </section>

  <section id="pdf-import-card">
    <h2 data-i18n="opt_pdf_import_heading"></h2>
    <p class="muted" style="margin:-4px 0 10px" data-i18n="opt_pdf_import_intro"></p>
    <div class="actions">
      <button type="button" id="pdf-import-choose" data-i18n="opt_pdf_import_choose"></button>
      <button type="button" id="pdf-import-paste" class="link" data-i18n="opt_pdf_import_paste"></button>
      <input id="pdf-import-input" type="file" accept="application/pdf,.pdf" hidden>
    </div>
    <div id="pdf-import-msg" class="muted" role="status" style="margin-top:6px"></div>
    <div id="pdf-import-review" hidden style="margin-top:10px">
      <label for="pdf-import-text" data-i18n="opt_pdf_import_text_label"></label>
      <textarea id="pdf-import-text" style="min-height:220px"></textarea>
      <div class="actions" style="margin-top:8px">
        <button type="button" id="pdf-import-go" class="primary" data-i18n="opt_pdf_import_go"></button>
        <span id="pdf-import-ai" class="muted"></span>
      </div>
    </div>
  </section>

  <section id="library-card">
    <h2 data-i18n="opt_library_heading"></h2>
    <p class="muted" style="margin:-4px 0 10px" data-i18n="opt_library_intro"></p>
    <ul id="cv-list" class="cv-list"></ul>
    <div class="actions">
      <button type="button" id="new-cv" data-i18n="opt_library_new"></button>
      <span id="library-msg" class="muted"></span>
    </div>
  </section>

  <section id="file-card">
    <h2 data-i18n="opt_file_heading"></h2>
    <p class="muted" style="margin:-4px 0 10px" data-i18n="opt_file_intro"></p>
    <div class="actions">
      <span id="cv-file-name" class="grow"></span>
      <button type="button" id="cv-file-preview" data-i18n="opt_file_preview" hidden></button>
      <button type="button" id="cv-file-choose"></button>
      <button type="button" id="cv-file-remove" class="link" data-i18n="opt_file_use_generated" hidden></button>
      <input id="cv-file-input" type="file" accept="application/pdf,.pdf" hidden>
    </div>
    <div id="cv-file-msg" class="muted" style="margin-top:6px"></div>
  </section>

  <section>
    <h2 data-i18n="opt_basics"></h2>
    <div class="row">
      <div><label for="b_name" data-i18n="field_full_name"></label><input id="b_name" autocomplete="off"></div>
      <div><label for="b_label" data-i18n="field_current_title"></label><input id="b_label" autocomplete="off"></div>
      <div><label for="b_email" data-i18n="field_email"></label><input id="b_email" type="email" autocomplete="off"></div>
      <div><label for="b_phone" data-i18n="field_phone"></label><input id="b_phone" autocomplete="off"></div>
      <div><label for="b_city" data-i18n="field_city"></label><input id="b_city" autocomplete="off"></div>
      <div><label for="b_linkedin" data-i18n="field_linkedin_url"></label><input id="b_linkedin" autocomplete="off"></div>
      <div><label for="b_portfolio" data-i18n="field_portfolio_url"></label><input id="b_portfolio" autocomplete="off"></div>
      <div><label for="b_github" data-i18n="field_github_url"></label><input id="b_github" autocomplete="off"></div>
    </div>
    <div class="row one" style="margin-top:10px">
      <div><label for="b_summary" data-i18n="field_summary"></label><textarea id="b_summary"></textarea></div>
    </div>
  </section>

  <section>
    <h2 data-i18n="opt_work"></h2>
    <div id="work"></div>
    <button type="button" id="add-work" data-i18n="opt_add_work"></button>
  </section>

  <section>
    <h2 data-i18n="opt_education"></h2>
    <div id="education"></div>
    <button type="button" id="add-education" data-i18n="opt_add_education"></button>
  </section>

  <section>
    <h2 data-i18n="opt_skills"></h2>
    <label for="skills" data-i18n="opt_skills_help"></label>
    <textarea id="skills"></textarea>
    <div style="margin-top:12px">
      <h2 data-i18n="opt_languages" style="margin-bottom:6px"></h2>
      <div id="languages"></div>
      <button type="button" id="add-language" data-i18n="opt_add_language"></button>
    </div>
  </section>

  <section>
    <h2 data-i18n="opt_extras"></h2>
    <p class="muted" style="margin-top:0" data-i18n="opt_extras_help"></p>
    <div class="row">
      <div><label for="x_street" data-i18n="field_street"></label><input id="x_street" autocomplete="off"></div>
      <div><label for="x_postal_code" data-i18n="field_postal_code"></label><input id="x_postal_code" autocomplete="off"></div>
      <div><label for="x_country" data-i18n="field_country"></label><input id="x_country" autocomplete="off"></div>
      <div><label for="x_work_authorization" data-i18n="field_work_authorization"></label><input id="x_work_authorization" autocomplete="off"></div>
      <div><label for="x_salary_expectation" data-i18n="field_salary_expectation"></label><input id="x_salary_expectation" autocomplete="off"></div>
      <div><label for="x_notice_period" data-i18n="field_notice_period"></label><input id="x_notice_period" autocomplete="off"></div>
      <div><label for="x_availability_date" data-i18n="field_availability_date"></label><input id="x_availability_date" autocomplete="off"></div>
    </div>
  </section>

  <section>
    <h2 data-i18n="opt_privacy_heading"></h2>
    <p class="muted" style="margin:0" data-i18n="opt_privacy"></p>
    <div class="actions" style="margin-top:10px">
      <button type="button" id="unpair" class="link" data-i18n="opt_unpair" hidden></button>
      <button type="button" id="forget" class="danger" data-i18n="opt_forget"></button>
    </div>
  </section>
</div>

<div data-view="candidatures" hidden>
  <h1 data-i18n="trk_title"></h1>
  <p class="muted" style="margin-top:0" data-i18n="trk_intro"></p>
  <div class="trk-bar">
    <button type="button" id="trk-add" class="primary" aria-expanded="false" aria-controls="trk-add-form" data-i18n="trk_add"></button>
    <span class="grow"></span>
    <button type="button" id="trk-export" data-i18n="trk_export"></button>
  </div>
  <form id="trk-add-form" class="add-form" hidden novalidate>
    <div class="row">
      <div><label for="trk-add-title" data-i18n="trk_col_title"></label><input id="trk-add-title" autocomplete="off" maxlength="200"></div>
      <div><label for="trk-add-company" data-i18n="trk_col_company"></label><input id="trk-add-company" autocomplete="off" maxlength="200"></div>
      <div><label for="trk-add-url" data-i18n="trk_add_url"></label><input id="trk-add-url" type="url" inputmode="url" autocomplete="off" placeholder="https://"></div>
      <div><label for="trk-add-status" data-i18n="trk_col_status"></label><select id="trk-add-status"></select></div>
    </div>
    <div class="actions" style="margin-top:10px">
      <button type="submit" class="primary" data-i18n="trk_add_save"></button>
      <button type="button" id="trk-add-cancel" class="link" data-i18n="trk_add_cancel"></button>
      <span id="trk-add-msg" class="warn" role="status"></span>
    </div>
  </form>
  <div id="trk-board" class="board" hidden></div>
  <div id="trk-empty" class="empty muted" data-i18n="trk_empty" hidden></div>
  <div class="trk-bar">
    <button type="button" id="trk-clear" class="link danger" data-i18n="trk_clear" hidden></button>
  </div>
</div>
<div data-view="sites" hidden>
  <h1 data-i18n="sites_title"></h1>
  <p class="muted" style="margin-top:0" data-i18n="sites_intro"></p>
  <section>
    <ul id="sites-list" class="cv-list"></ul>
    <p id="sites-empty" class="muted" style="margin:0" data-i18n="sites_empty" hidden></p>
  </section>
</div>
</main>
</div>

<div class="bar" data-view="cv">
  <div class="bar-inner">
    <span id="saved" class="muted grow"></span>
    <button type="button" id="save" class="primary" data-i18n="opt_save"></button>
  </div>
</div>
<script type="module" src="src/dashboard/index.js"></script>
</body>
</html>
