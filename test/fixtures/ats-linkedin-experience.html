<!doctype html>
<html lang="en" data-must-fill>
<!-- The shape of LinkedIn Easy Apply's "add an experience" step (measured 2026-10-18), rebuilt
     in our own words. The dates are month and year dropdowns under their own "From" and "To"
     captions: a caption over the halves of one date is part of the job, not a group of its
     own, so the dates belong to the block like the title does. The role is still in
     progress, so "To" stays empty and the "I currently work here" box is the person's. -->
<meta charset="utf-8"><title>Apply (LinkedIn Easy Apply shape, experience step)</title>
<body>
<div role="dialog" aria-labelledby="li-h">
  <h2 id="li-h">Apply to Example</h2>
  <form onsubmit="window.__submitted = true; return false">
    <h3>Work experience</h3>
    <div>
      <div><label for="li-title">Your title</label><input id="li-title" type="text" data-expect="work[0].position"></div>
      <div><label for="li-co">Company</label><input id="li-co" type="text" data-expect="work[0].company"></div>
      <div><input id="li-now" type="checkbox" data-expect="none"><label for="li-now">I currently work here</label></div>
      <div>
        <label>Dates of employment</label>
      <fieldset>
        <legend>From</legend>
        <label for="li-from-m">Month of From</label>
        <select id="li-from-m" name="month" data-expect="work[0].start" data-expect-value="3"><option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select>
        <label for="li-from-y">Year of From</label>
        <select id="li-from-y" name="year" data-expect="work[0].start" data-expect-value="2021"><option value="">Year</option><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option><option value="2022">2022</option><option value="2021">2021</option><option value="2020">2020</option><option value="2019">2019</option><option value="2018">2018</option><option value="2017">2017</option><option value="2016">2016</option><option value="2015">2015</option><option value="2014">2014</option><option value="2013">2013</option><option value="2012">2012</option><option value="2011">2011</option><option value="2010">2010</option><option value="2009">2009</option><option value="2008">2008</option><option value="2007">2007</option><option value="2006">2006</option><option value="2005">2005</option><option value="2004">2004</option><option value="2003">2003</option><option value="2002">2002</option><option value="2001">2001</option><option value="2000">2000</option></select>
      </fieldset>
      <fieldset>
        <legend>To</legend>
        <label for="li-to-m">Month of To</label>
        <select id="li-to-m" name="month" data-expect="none"><option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select>
        <label for="li-to-y">Year of To</label>
        <select id="li-to-y" name="year" data-expect="none"><option value="">Year</option><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option><option value="2022">2022</option><option value="2021">2021</option><option value="2020">2020</option><option value="2019">2019</option><option value="2018">2018</option><option value="2017">2017</option><option value="2016">2016</option><option value="2015">2015</option><option value="2014">2014</option><option value="2013">2013</option><option value="2012">2012</option><option value="2011">2011</option><option value="2010">2010</option><option value="2009">2009</option><option value="2008">2008</option><option value="2007">2007</option><option value="2006">2006</option><option value="2005">2005</option><option value="2004">2004</option><option value="2003">2003</option><option value="2002">2002</option><option value="2001">2001</option><option value="2000">2000</option></select>
      </fieldset>
      </div>
      <div><label for="li-city">City</label><input id="li-city" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" data-expect="work[0].location"></div>
      <div><label for="li-desc">Description</label><textarea id="li-desc" data-expect="work[0].description"></textarea></div>
    </div>
    <button type="button">Save</button>
  </form>
</div>
</body></html>
