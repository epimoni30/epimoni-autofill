<!doctype html>
<html lang="fr">
<!-- The false-positive gauntlet. Every control here must be left alone. If the engine
     touches one of these, the Phase 0 gate fails — a wrong value in a submitted
     application is the one unrecoverable failure mode. -->
<meta charset="utf-8"><title>Pièges</title>
<body>
<form id="login">
  <legend>Connexion à votre espace</legend>
  <label for="le">Adresse e-mail</label><input id="le" name="email" type="email" data-expect="none">
  <label for="lp">Mot de passe</label><input id="lp" name="password" type="password" data-expect="none">
</form>
<form id="pay">
  <label for="ccn">Nom sur la carte</label><input id="ccn" name="ccname" autocomplete="cc-name" data-expect="none">
  <label for="ccno">Numéro de carte</label><input id="ccno" autocomplete="cc-number" data-expect="none">
</form>
<form id="misc">
  <label for="ss">Numéro de sécurité sociale</label><input id="ss" data-expect="none">
  <label for="urg">Nom du contact d'urgence</label><input id="urg" data-expect="none">
  <label for="urgt">Téléphone du contact d'urgence</label><input id="urgt" type="tel" data-expect="none">
  <label for="ref">Adresse e-mail de votre recruteur</label><input id="ref" type="email" data-expect="none">
  <label for="fich">Nom du fichier</label><input id="fich" data-expect="none">
  <label for="ecole">Nom de l'école de votre enfant</label><input id="ecole" data-expect="none">
  <label for="poste">Poste recherché</label><input id="poste" data-expect="none">
  <label for="hidden">Champ masqué</label><input id="hidden" style="display:none" data-expect="none">
  <label for="ro">Référence de l'offre</label><input id="ro" value="REF-2026-118" readonly data-expect="none">
</form>
<!-- Concealed from the user but not from the page's own script: the classic autofill
     exfiltration shapes. Each would be filled with a CV value by a naive visibility check. -->
<form id="concealed">
  <div style="opacity:0"><label for="hx1">Adresse e-mail</label><input id="hx1" type="email" data-expect="none"></div>
  <div style="position:absolute;left:-9999px;top:0"><label for="hx2">Téléphone</label><input id="hx2" type="tel" data-expect="none"></div>
  <div><label for="hx3">Ville</label><input id="hx3" style="position:absolute;width:40px;height:20px;clip:rect(0,0,0,0);overflow:hidden" data-expect="none"></div>
  <div style="visibility:hidden"><label for="hx4">Nom</label><input id="hx4" data-expect="none"></div>
</form>
<!-- A <label> that wraps its <select>, the way Lever writes it. The options are answers, not
     the question: read into the label, "Mexico City" made this a city field and picked the
     person's home town as the office they'd prefer. -->
<form id="wrapped-select">
  <label>
    <div>Which office would you prefer?</div>
    <div>
      <select name="cards[c3][field0]" data-expect="none">
        <option value="">Select...</option>
        <option>Paris</option>
        <option>Nantes</option>
        <option>Mexico City</option>
      </select>
    </div>
  </label>
</form>
<!-- Years in one domain are not the career total. Seen on a live Teamtailor form, where the
     total went into a question about outbound sales. -->
<form id="domain-years">
  <label for="dy1">How many years of outbound sales experience do you have?</label>
  <input id="dy1" name="question_1" type="number" data-expect="none">
  <label for="dy2">Années d'expérience en gestion de projet</label>
  <input id="dy2" name="question_2" type="number" data-expect="none">
</form>
<!-- The opposite question. Seen on live Greenhouse forms: "Will you require sponsorship?" was
     read as the work authorisation question, and the stored answer ("Oui, ressortissant UE")
     picks "Oui" here, telling the employer the person needs a visa. -->
<form id="sponsorship">
  <fieldset>
    <legend>Aurez-vous besoin d'un parrainage de visa pour travailler en France ?</legend>
    <label><input type="radio" name="sponsor_fr" value="oui" data-expect="none"> Oui</label>
    <label><input type="radio" name="sponsor_fr" value="non" data-expect="none"> Non</label>
  </fieldset>
  <label for="sp2">Will you now or in the future require sponsorship for employment visa status?</label>
  <select id="sp2" name="question_9" data-expect="none">
    <option value="">Select...</option>
    <option>Oui</option>
    <option>Non</option>
  </select>
</form>
<!-- The right question about the wrong country. The stored answer is "Oui, ressortissant UE":
     true in France, false in the United States, and "Oui" here would say otherwise. -->
<form id="other-country">
  <fieldset>
    <legend>Êtes-vous autorisé(e) à travailler aux États-Unis ?</legend>
    <label><input type="radio" name="auth_us" value="oui" data-expect="none"> Oui</label>
    <label><input type="radio" name="auth_us" value="non" data-expect="none"> Non</label>
  </fieldset>
</form>
<!-- "Votre expérience" is the years question only as a list of year brackets with nothing else
     in its label. As prose, about one domain, or as seniority words, it is something else. -->
<form id="experience-not-years">
  <label for="xp1">Votre expérience</label><textarea id="xp1" name="question_16" data-expect="none"></textarea>
  <label for="xp2">Votre expérience en management</label>
  <select id="xp2" name="question_17" data-expect="none">
    <option value="">Choisir…</option><option>Moins d'1 an</option><option>1 à 3 ans</option><option>5 à 10 ans</option><option>Plus de 10 ans</option>
  </select>
  <label for="xp3">Votre expérience</label>
  <select id="xp3" name="question_18" data-expect="none">
    <option value="">Choisir…</option><option>Junior</option><option>Confirmé</option><option>Senior</option>
  </select>
</form>
<!-- The salary someone earns now is not the one they ask for, even with the same brackets. -->
<form id="current-salary">
  <label for="cs">Salaire actuel</label>
  <select id="cs" name="question_19" data-expect="none">
    <option value="">Choisir…</option><option>30 000 à 40 000 €</option><option>40 000 à 50 000 €</option><option>Plus de 50 000 €</option>
  </select>
</form>
<!-- A place the country table doesn't hold. Read as "no place named", it was answered through
     the country the person lives in, and "Oui" here claims a right they may not have. -->
<form id="unknown-country">
  <fieldset>
    <legend>Avez-vous le droit de travailler à Hong Kong ?</legend>
    <label><input type="radio" name="auth_hk" value="oui" data-expect="none"> Oui</label>
    <label><input type="radio" name="auth_hk" value="non" data-expect="none"> Non</label>
  </fieldset>
  <fieldset>
    <legend>Are you legally authorized to work in the country where this job is located?</legend>
    <label><input type="radio" name="auth_where" value="oui" data-expect="none"> Oui</label>
    <label><input type="radio" name="auth_where" value="non" data-expect="none"> Non</label>
  </fieldset>
</form>
<!-- "Location" about the job, not the person. Seen on live Ashby and Lever forms. The person
     lives in Nantes, so a city answer here would pick an office they never chose. -->
<form id="job-location">
  <label for="jl1">Which location are you applying for?</label>
  <select id="jl1" name="question_11" data-expect="none">
    <option value="">Select...</option>
    <option>Paris</option>
    <option>Nantes</option>
  </select>
  <label for="jl2">Office location</label><input id="jl2" name="question_12" data-expect="none">
  <label for="jl3">Preferred work location</label><input id="jl3" name="question_13" data-expect="none">
  <label for="jl4">In which school are you enrolled for this work-study program?</label>
  <input id="jl4" name="question_14" data-expect="none">
</form>
</body></html>
